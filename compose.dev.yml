---
services:
  flyway:
    image: 'flyway/flyway:7.3.1'
    container_name: 'the-gear-of-seasons_flyway'
    hostname: 'the-gear-of-seasons_flyway'
    restart: 'no'
    volumes:
      - ./db/flyway_data/sql:/flyway/sql
      - ./db/flyway_data/conf:/flyway/conf
    networks:
      - 'dev-link'
    profiles: ['tool']

  postgres-dev:
    image: 'postgres:13-alpine'
    container_name: 'the-gear-of-seasons_postgres-dev'
    hostname: 'the-gear-of-seasons_postgres-dev'
    environment:
      - 'POSTGRES_DB=the-gear-of-seasons'
      - 'POSTGRES_USER=the-gear-of-seasons'
      - 'POSTGRES_PASSWORD=the-gear-of-seasons'
      - 'POSTGRES_INITDB_ARGS=--encoding=UTF8'
      - 'TZ=Asia/Tokyo'
      - 'PGTZ=Asia/Tokyo'
    expose:
      - '5432'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - './dev-var/psql:/var/lib/postgresql/data:z'
      - './db/helpers:/helpers'
    networks:
      - 'dev-link'
    tty: true
    stdin_open: true

  app-dev:
    build:
      context: '.'
      target: 'tools'
    container_name: 'the-gear-of-seasons_app-dev'
    hostname: 'the-gear-of-seasons_app-dev'
    depends_on:
      - postgres-dev
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      - 'OMOTE_HOST=localhost'
      - 'URA_HOST=ura.localhost'
      - 'OMOTE_ORIGIN=http://localhost:8889'
      - 'DB_HOST=postgres-dev'
      - 'TZ=Asia/Tokyo'
      - 'npm_config_cache=/app/dev-var/npm-cache'
    command:
      - 'sh'
      - '-c'
      - '(cd client && npm ci && npm run build) && (cd server && npm ci && npm run build) && exec node server/dist/cmd/main.js'
    ports:
      - '127.0.0.1:8889:3000'
    volumes:
      - '.:/app'
      - './dev-var/storage:/app/_storage'
    networks:
      - 'dev-link'

networks:
  dev-link:
    external: false
